name: AI TrendRadar daily digest

on:
  schedule:
    # 03:30 UTC = 09:00 IST, every day
    - cron: "30 3 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write          # to commit the generated docs/ pages back to the repo

concurrency:
  group: trendradar
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python trendradar.py

      - name: Commit & push updated pages
        run: |
          git config user.name "trendradar-bot"
          git config user.email "actions@github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "TrendRadar digest $(date -u +%Y-%m-%d)"
            git push
          fi
