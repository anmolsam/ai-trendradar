# AI TrendRadar configuration
# Edit keywords/recipients here. No code changes needed.

# Output is a daily HTML page published to GitHub Pages (docs/).
# No email — each run adds docs/<date>.html and rebuilds docs/index.html.

# QUALITY BAR — only genuinely trending / well-starred / upvoted items get shown.
github:
  min_stars: 40          # search repos must already have at least this many stars
  active_within_days: 30 # ...and have been pushed within this window (maintained)
  # (the github.com/trending board is also used — those are kept by stars-today)

# arXiv: drop weak matches. score = sum of theme weights (frontier=3, mcp=3,
# agents=2, advancement=1). min 2 means it must hit a strong topic or ≥2 themes,
# not just a generic "llm" mention.
arxiv_min_score: 2

# Max items per section
limits:
  github: 20
  arxiv: 20
  huggingface: 15
  feeds: 30

# Only show blog/lab posts published in the last N days (1 = today only)
feeds_lookback_days: 1
# Max posts per single source (stops one noisy feed dominating)
feeds_per_source: 3

# Hugging Face Daily Papers (community-upvoted) — the highest-signal paper source.
# HF papers accrue upvotes over ~2 days, so we look back a few days to catch the
# matured, well-upvoted ones; the never-repeat ledger keeps each day fresh.
huggingface:
  enabled: true
  lookback_days: 3
  min_upvotes: 3      # ignore papers the community hasn't actually upvoted

# English-only filter. Repos/papers with predominantly non-Latin (CJK etc.)
# titles+descriptions are dropped.
english_only: true

# Topic themes. An item is kept if its text matches ANY keyword below.
# Matching is case-insensitive substring. Keep keywords lowercase.
themes:
  ai_advancement:
    - large language model
    - foundation model
    - reasoning model
    - multimodal
    - diffusion model
    - transformer
    - fine-tuning
    - fine tuning
    - retrieval augmented
    - rag
    - benchmark
    - state of the art
    - alignment
    - reinforcement learning
    - inference engine
    - quantization
    - llm

  ai_agents:
    - ai agent
    - agentic
    - autonomous agent
    - multi-agent
    - multi agent
    - agent framework
    - tool use
    - tool calling
    - computer use
    - browser agent
    - coding agent

  mcp:
    - mcp server
    - model context protocol
    - mcp client
    - "mcp "

  frontier_labs:
    - anthropic
    - claude
    - openai
    - gpt-4
    - gpt-5
    - o1
    - o3
    - deepmind
    - gemini
    - mistral
    - llama
    - qwen
    - deepseek
    - grok
    - xai

  faang:
    - meta ai
    - nvidia
    - microsoft research
    - google research
    - apple intelligence
    - amazon bedrock

# Extra GitHub Search API queries (run in addition to scraping github.com/trending).
# Each is a free-text query; results are filtered by themes + english_only too.
github_search_queries:
  - mcp server
  - model context protocol
  - ai agent framework
  - agentic workflow
  - llm framework

# arXiv categories to pull recent submissions from.
arxiv_categories:
  - cs.AI
  - cs.CL
  - cs.LG
  - cs.MA   # multi-agent systems

# Blog / lab / institute RSS feeds — the output of the top companies & labs.
# Each post is theme-filtered, English-only, recency-capped, and never repeated.
# type is just a display label (lab / institute / news). Add or remove freely.
feeds:
  # --- Frontier labs & big-tech AI (their own blogs) ---
  - {label: "OpenAI",            type: lab, url: "https://openai.com/news/rss.xml"}
  - {label: "Google DeepMind",   type: lab, url: "https://deepmind.google/blog/rss.xml"}
  - {label: "Google Research",   type: lab, url: "https://research.google/blog/rss/"}
  - {label: "Microsoft Research",type: lab, url: "https://www.microsoft.com/en-us/research/feed/"}
  - {label: "NVIDIA",            type: lab, url: "https://developer.nvidia.com/blog/feed/"}
  - {label: "Apple ML",          type: lab, url: "https://machinelearning.apple.com/rss.xml"}
  - {label: "Hugging Face",      type: lab, url: "https://huggingface.co/blog/feed.xml"}
  - {label: "Together AI",       type: lab, url: "https://www.together.ai/blog/rss.xml"}
  - {label: "AWS ML",            type: lab, url: "https://aws.amazon.com/blogs/machine-learning/feed/"}
  # --- Top institutes ---
  - {label: "Berkeley BAIR",     type: institute, url: "https://bair.berkeley.edu/blog/feed.xml"}
  - {label: "CMU ML",            type: institute, url: "https://blog.ml.cmu.edu/feed/"}
  - {label: "MIT News AI",       type: institute, url: "https://news.mit.edu/rss/topic/artificial-intelligence2"}
  - {label: "Stanford SAIL",     type: institute, url: "https://ai.stanford.edu/blog/feed.xml"}
  # --- Labs without their own feed: Google News search (last 7 days) ---
  - {label: "Anthropic", type: news, url: "https://news.google.com/rss/search?q=when:1d%20Anthropic%20Claude%20AI&hl=en-US&gl=US&ceid=US:en"}
  - {label: "Meta AI",   type: news, url: "https://news.google.com/rss/search?q=when:1d%20(Meta%20AI%20OR%20FAIR%20OR%20Llama)%20model&hl=en-US&gl=US&ceid=US:en"}
  - {label: "Mistral AI",type: news, url: "https://news.google.com/rss/search?q=when:1d%20Mistral%20AI%20model&hl=en-US&gl=US&ceid=US:en"}
  - {label: "DeepSeek",  type: news, url: "https://news.google.com/rss/search?q=when:1d%20DeepSeek%20AI%20model&hl=en-US&gl=US&ceid=US:en"}
  - {label: "xAI Grok",  type: news, url: "https://news.google.com/rss/search?q=when:1d%20xAI%20Grok&hl=en-US&gl=US&ceid=US:en"}
  # --- AI news aggregator ---
  - {label: "MarkTechPost",      type: news, url: "https://www.marktechpost.com/feed/"}
